# Upstream Gunicorn Socket
upstream chronicle_app {
    server unix:/run/chronicle.sock fail_timeout=0;
}

# HTTP — Redirect all requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name thechronicle.news www.thechronicle.news;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thechronicle.news www.thechronicle.news;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/thechronicle.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thechronicle.news/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client limits & timeouts
    client_max_body_size 25M;
    keepalive_timeout 65;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Files (Aggressive Long-term Caching via WhiteNoise / Nginx)
    location /static/ {
        alias /var/www/chronicle/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Files (User uploads: articles, avatars)
    location /media/ {
        alias /var/www/chronicle/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Robots & Favicon
    location = /robots.txt {
        proxy_pass http://chronicle_app;
        access_log off;
    }
    location = /favicon.ico {
        alias /var/www/chronicle/static/favicon.ico;
        access_log off;
    }

    # Pass all remaining requests to Django/Gunicorn
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        proxy_pass http://chronicle_app;
    }
}
