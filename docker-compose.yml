services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-production-docker-key-replace-with-custom-random-secret-key-2026!
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=chronicle_db
      - DB_USER=chronicle_user
      - DB_PASSWORD=chronicle_secure_password_2026!
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SEED_DEMO_DATA=True
      - DJANGO_SETTINGS_MODULE=news_project.settings.prod
      - SECURE_SSL_REDIRECT=False
      - SESSION_COOKIE_SECURE=False
      - CSRF_COOKIE_SECURE=False
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chronicle_net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=chronicle_db
      - POSTGRES_USER=chronicle_user
      - POSTGRES_PASSWORD=chronicle_secure_password_2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle_user -d chronicle_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronicle_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronicle_net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - chronicle_net

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  chronicle_net:
    driver: bridge
